{% extends "base_auth.html" %}{% block auth_body %}
<div class="self-center bg-slate-200 rounded-2xl p-3.5">
  <svg
    xmlns="http://www.w3.org/2000/svg"
    fill="none"
    viewBox="0 0 24 24"
    stroke-width="1.5"
    stroke="currentColor"
    class="size-10"
  >
    <path
      stroke-linecap="round"
      stroke-linejoin="round"
      d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126ZM12 15.75h.007v.008H12v-.008Z"
    />
  </svg>
</div>
<p class="text-center font-bold text-lg">
  エラーが発生しました。<br />
  認証を最初からやり直してください。
</p>
<button
  class="bg-slate-700 text-slate-100 w-full rounded-lg p-3 hover:bg-slate-800 cursor-pointer"
  id="return-twitter-auth-button"
>
  <div class="flex justify-center gap-2">
    <svg
      xmlns="http://www.w3.org/2000/svg"
      fill="none"
      viewBox="0 0 24 24"
      stroke-width="1.5"
      stroke="currentColor"
      class="size-6"
    >
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        d="M9 15 3 9m0 0 6-6M3 9h12a6 6 0 0 1 0 12h-3"
      />
    </svg>
    <p>Twitterと連携ページに戻る</p>
  </div>
</button>
<script>
  $(document).ready(() => {
    $("#return-twitter-auth-button").on("click", () => {
      location.href = "/users/twitter_auth/";
    });
  });
</script>
{% endblock %}
