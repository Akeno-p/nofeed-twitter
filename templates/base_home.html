{% extends "base.html" %} {% block content %}
<div class="min-h-screen flex flex-row">
  <div class="w-80 border-r-2 border-slate-300 flex flex-col p-6">
    <p class="text-3xl font-bold text-slate-700 my-4">nofeed-twitter</p>
    <div class="flex flex-col flex-1 gap-3 mt-4" id="sidebar">
      <div
        class="flex flex-row items-center gap-4 px-4 py-3 rounded-2xl text-slate-500 hover:bg-slate-200 hover:text-slate-700 cursor-pointer"
        data-url="{% url 'tweets' %}"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
          stroke-width="1.5"
          stroke="currentColor"
          class="size-8"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="m2.25 12 8.954-8.955c.44-.439 1.152-.439 1.591 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21h4.125c.621 0 1.125-.504 1.125-1.125V9.75M8.25 21h8.25"
          />
        </svg>
        <p class="text-xl">ツイート</p>
      </div>
      <div
        class="flex flex-row items-center gap-4 px-4 py-3 rounded-2xl text-slate-500 hover:bg-slate-200 hover:text-slate-700 cursor-pointer"
        data-url="{% url 'reply' %}"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
          stroke-width="1.5"
          stroke="currentColor"
          class="size-8"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M9 15 3 9m0 0 6-6M3 9h12a6 6 0 0 1 0 12h-3"
          />
        </svg>
        <p class="text-xl">リプライ</p>
      </div>
      <div
        class="flex flex-row items-center gap-4 px-4 py-3 rounded-2xl text-slate-500 hover:bg-slate-200 hover:text-slate-700 cursor-pointer"
        data-url="{% url 'dm' %}"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
          stroke-width="1.5"
          stroke="currentColor"
          class="size-8"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M8.625 9.75a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Zm0 0H8.25m4.125 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Zm0 0H12m4.125 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Zm0 0h-.375m-13.5 3.01c0 1.6 1.123 2.994 2.707 3.227 1.087.16 2.185.283 3.293.369V21l4.184-4.183a1.14 1.14 0 0 1 .778-.332 48.294 48.294 0 0 0 5.83-.498c1.585-.233 2.708-1.626 2.708-3.228V6.741c0-1.602-1.123-2.995-2.707-3.228A48.394 48.394 0 0 0 12 3c-2.392 0-4.744.175-7.043.513C3.373 3.746 2.25 5.14 2.25 6.741v6.018Z"
          />
        </svg>
        <p class="text-xl">DM</p>
      </div>
      <div
        class="flex flex-row items-center gap-4 px-4 py-3 rounded-2xl text-slate-500 hover:bg-slate-200 hover:text-slate-700 cursor-pointer"
        data-url="{% url 'api_usage' %}"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
          stroke-width="1.5"
          stroke="currentColor"
          class="size-8"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="m9 7.5 3 4.5m0 0 3-4.5M12 12v5.25M15 12H9m6 3H9m12-3a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z"
          />
        </svg>
        <p class="text-xl">API利用料金</p>
      </div>
      <button
        class="bg-slate-700 text-slate-100 w-full rounded-lg p-3 my-4 hover:bg-slate-800 cursor-pointer"
        id="tweet-button"
      >
        <div class="flex justify-center items-center gap-2">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="1.5"
            stroke="currentColor"
            class="size-8"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M6 12 3.269 3.125A59.769 59.769 0 0 1 21.485 12 59.768 59.768 0 0 1 3.27 20.875L5.999 12Zm0 0h7.5"
            />
          </svg>
          <p>ツイート</p>
        </div>
      </button>
    </div>
    <div class="h-10">ユーザー情報</div>
  </div>
  <div class="flex-1">{% block home_body %} {% endblock home_body %}</div>
</div>
<script>
  $(document).ready(() => {
    const pathName = location.pathname;
    $(`#sidebar [data-url="${pathName}"]`)
      .removeClass("text-slate-500")
      .addClass("bg-slate-200 text-slate-700");
    $("#sidebar [data-url]").on("click", function () {
      location.href = $(this).data("url");
    });
  });
</script>
{% endblock content %}
