{% extends "base_home.html" %} {% block home_body %}
<div
  class="border-b-2 border-slate-300 h-1/12 px-8 flex items-center justify-between"
>
  <h2 class="text-3xl font-bold">DM</h2>
  <button
    class="bg-slate-100 text-slate-700 border border-slate-500 rounded-3xl ml-2 p-2 hover:bg-slate-700 hover:text-slate-100 cursor-pointer"
    id="open-get-dms-modal"
  >
    <div class="flex justify-center items-center gap-2">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        fill="none"
        viewBox="0 0 24 24"
        stroke-width="1.5"
        stroke="currentColor"
        class="size-8"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M3 4.5h14.25M3 9h9.75M3 13.5h9.75m4.5-4.5v12m0 0-3.75-3.75M17.25 21 21 17.25"
        />
      </svg>
      <p class="text-lg">DM取得</p>
    </div>
  </button>
</div>

{% include "dm/_dm_body.html" %}

<!-- DM取得モーダル -->
<dialog
  class="m-auto border-2 border-slate-300 rounded-2xl w-xl focus:outline-none"
  id="get-dms-modal"
>
  <div class="flex flex-col p-2 bg-slate-50 text-slate-700">
    <div>
      <svg
        xmlns="http://www.w3.org/2000/svg"
        fill="none"
        viewBox="0 0 24 24"
        stroke-width="1.5"
        stroke="currentColor"
        class="size-8 text-slate-500 hover:text-slate-700 cursor-pointer"
        id="close-get-dms-modal"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M6 18 18 6M6 6l12 12"
        />
      </svg>
    </div>
    <div class="flex flex-col items-center justify-center p-5">
      <div class="self-center rounded-2xl bg-slate-200 p-2 mb-4">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
          stroke-width="1.5"
          stroke="currentColor"
          class="size-10"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M3 16.5v2.25A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75V16.5M16.5 12 12 16.5m0 0L7.5 12m4.5 4.5V3"
          />
        </svg>
      </div>
      <p class="text-xl">未取得のDMを取得してもよろしいですか？</p>
      <p class="text-lg">※ DMの取得1件につき約1.5円かかります。</p>
      <button
        class="bg-slate-700 text-slate-100 text-lg w-52 rounded-lg p-2 mt-6 hover:bg-slate-800 cursor-pointer"
        id="get-dms-button"
      >
        <div class="flex justify-center items-center gap-2">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="1.5"
            stroke="currentColor"
            class="size-8"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M3 16.5v2.25A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75V16.5M16.5 12 12 16.5m0 0L7.5 12m4.5 4.5V3"
            />
          </svg>
          <p>取得</p>
        </div>
      </button>
    </div>
  </div>
</dialog>

{% include "_image_modal.html" %}

<script>
  $(document).ready(() => {
    // 会話の切り替え系
    let selectedConversationId = null;

    const selectConversation = (conversationId) => {
      selectedConversationId = conversationId;

      $("[data-conversation]").removeClass("bg-slate-200");
      $(`[data-conversation="${conversationId}"]`).addClass("bg-slate-200");

      $("[data-thread]").addClass("hidden");
      const $thread = $(`[data-thread="${conversationId}"]`);
      $thread.removeClass("hidden");

      // 最新のDMが見えるように一番下までスクロールする
      const messages = $thread.find("[data-messages]")[0];
      messages.scrollTop = messages.scrollHeight;
    };

    // 選択中の会話がない場合は一番上の会話を開く
    const selectSavedOrFirstConversation = () => {
      const $conversations = $("[data-conversation]");
      if ($conversations.length === 0) {
        return;
      }

      const $savedConversation = $conversations.filter(
        `[data-conversation="${selectedConversationId}"]`,
      );
      if ($savedConversation.length === 0) {
        selectConversation($conversations.first().data("conversation"));
        return;
      }

      selectConversation(selectedConversationId);
    };

    $(document).on("click", "[data-conversation]", function () {
      selectConversation($(this).data("conversation"));
    });

    selectSavedOrFirstConversation();

    // 画像拡大表示
    $(document).on("click", "[data-dm-media] img", function () {
      const imageUrl = $(this).attr("src");
      $("#img-modal img").attr("src", imageUrl);
      $("#img-modal")[0].showModal();
    });
    $("#img-modal button").on("click", () => {
      $("#img-modal")[0].close();
    });

    // DM送信系
    $(document).on("click", "[data-dm-button]", function () {
      const conversationId = $(this).data("dm-button");
      const dmText = $(`[data-dm-text="${conversationId}"]`).val();

      if (dmText === "") {
        showToast("DMの文章を入力してください。");
        return;
      }

      $.ajax({
        url: "{% url 'post_dm' %}",
        method: "POST",
        data: { dmText: dmText, conversationId: conversationId },
      }).done((response) => {
        if (response.status === "success") {
          $("#dm-body").replaceWith(response.html);
          selectSavedOrFirstConversation();
          showSuccessToast("送信しました");
        } else if (response.status === "error") {
          alert(
            "エラーコード" + response.error_code + "： " + response.message,
          );
        } else if (response.status === "exception") {
          alert(response.message);
        } else {
          alert("想定外のエラーが発生しました。");
        }
      });
    });

    // DM取得系
    $("#open-get-dms-modal").on("click", () => {
      $("#get-dms-modal")[0].showModal();
      $("#settings-popover").fadeOut();
    });
    $("#close-get-dms-modal").on("click", () => {
      $("#get-dms-modal")[0].close();
    });
    $("#get-dms-button").on("click", () => {
      $.ajax({
        url: "{% url 'save_all_dms' %}",
        method: "POST",
      }).done((response) => {
        if (response.status === "success") {
          $("#dm-body").replaceWith(response.html);
          selectSavedOrFirstConversation();
          showSuccessToast("成功");
          $("#get-dms-modal")[0].close();
        } else if (response.status === "partial") {
          $("#dm-body").replaceWith(response.html);
          selectSavedOrFirstConversation();
          showSuccessToast(response.message);
          $("#get-dms-modal")[0].close();
        } else if (response.status === "error") {
          $("#get-dms-modal")[0].close();
          alert(
            "エラーコード" + response.error_code + "： " + response.message,
          );
        } else if (response.status === "exception") {
          alert(response.message);
        } else {
          alert("想定外のエラーが発生しました。");
        }
      });
    });
  });
</script>
{% endblock home_body %}
